# Desarrollo reproducible: PostgreSQL+PostGIS, MinIO (S3 privado), API y web.
# Uso: docker compose up --build   (luego: docker compose exec api node apps/api/dist/db/seed-cli.js)
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aquisito
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aquisito
      MINIO_ROOT_PASSWORD: aquisito-dev-only
    ports: ["9000:9000", "9001:9001"]
    volumes: [s3data:/data]
  api:
    build: { context: ., dockerfile: infra/Dockerfile.api }
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/aquisito
      S3_ENDPOINT: http://minio:9000
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build: { context: ., dockerfile: infra/Dockerfile.web }
    environment:
      API_URL: http://api:4000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
  s3data:
